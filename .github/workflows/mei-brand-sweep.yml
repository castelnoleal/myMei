name: Mei brand sweep

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  sweep:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out Mei
        uses: actions/checkout@v4

      - name: Replace remaining user-facing Agent Zero labels
        shell: python
        run: |
          from pathlib import Path

          replacements = {
              "Hello! I'm Agent Zero": "Hello! I'm Mei",
              "Configure Agent Zero to your preferences.": "Configure Mei to your preferences.",
              "Extend Agent Zero with integrations.": "Extend Mei with integrations.",
              "Explore Agent Zero online and resources.": "Explore Mei online and resources.",
          }

          for path in Path("webui").rglob("*"):
              if not path.is_file() or path.suffix.lower() not in {".html", ".js", ".css", ".json", ".svg"}:
                  continue
              try:
                  text = path.read_text(encoding="utf-8")
              except UnicodeDecodeError:
                  continue
              updated = text
              for old, new in replacements.items():
                  updated = updated.replace(old, new)
              if updated != text:
                  path.write_text(updated, encoding="utf-8")

          # Use the Mei mark for the welcome-screen watermark as well.
          logo = Path("webui/public/dark.svg")
          watermark = Path("webui/public/darkSymbol.svg")
          if logo.exists() and watermark.exists():
              watermark.write_text(logo.read_text(encoding="utf-8"), encoding="utf-8")

      - name: Commit sweep and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add webui
          git rm .github/workflows/mei-brand-sweep.yml
          if git diff --cached --quiet; then
            echo "No brand changes required."
            exit 0
          fi
          git commit -m "rebrand: finish remaining Mei web UI labels"
          git push
