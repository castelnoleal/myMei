<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <title>Mei</title>
    <meta name="application-name" content="Mei">
    <meta name="apple-mobile-web-app-title" content="Mei">
    <meta name="description" content="Mei — an autonomous AI agent platform for creating, building, researching, and operating software.">

    <style id="startup-transition-critical">
        #startup-transition {
            position: fixed;
            inset: 0;
            z-index: 2147483647;
            display: grid;
            place-items: center;
            margin: 0;
            background: #131313;
            color: #fff;
            opacity: 1;
            transition: opacity 240ms ease;
        }
        #startup-transition[data-theme="light"],
        body.light-mode #startup-transition { background: #fafafa; color: #000; }
        #startup-transition > svg {
            width: clamp(12rem, 34vw, 23rem);
            max-width: 72vw;
            height: auto;
            opacity: 1;
            animation: none;
        }
        #startup-transition > p {
            position: absolute;
            width: 1px;
            height: 1px;
            overflow: hidden;
            clip-path: inset(50%);
        }
        #startup-transition.startup-transition-leaving {
            opacity: 0;
            pointer-events: none;
        }
        @media (prefers-reduced-motion: reduce) {
            #startup-transition { transition: none; }
        }
    </style>

    <script>
        if (location.pathname === "/safe") {
            const safeUrl = new URL(location.href)
            safeUrl.searchParams.delete("__direct")
            history.replaceState(null, "", `${safeUrl.pathname}${safeUrl.search}${safeUrl.hash}`)
            if ("serviceWorker" in navigator) {
                navigator.serviceWorker.getRegistrations()
                    .then((registrations) => Promise.allSettled(
                        registrations.map((registration) => registration.unregister()),
                    ))
                    .catch((error) => console.warn("Unable to disable service workers.", error))
            }
        }
    </script>

    <link rel="icon" type="image/svg+xml" href="public/favicon.svg">
    <link rel="preload" href="/vendor/google/google-icons.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="vendor/google/google-icons.css">
    <script type="module" src="/js/icons.js"></script>
    <script>
        (() => {
            const root = document.documentElement
            let applicationReady = false
            let revealStarted = false

            const revealApplication = (force = false) => {
                if (revealStarted || (!force && !applicationReady)) return
                const overlay = document.getElementById("startup-transition")
                if (!overlay) return
                revealStarted = true
                requestAnimationFrame(() => requestAnimationFrame(() => {
                    const removeOverlay = () => overlay.remove()
                    overlay.classList.add("startup-transition-leaving")
                    overlay.addEventListener("transitionend", removeOverlay, { once: true })
                })
            }

            window.addEventListener("mei-app-ready", () => {
                applicationReady = true
                revealApplication()
            })

            window.addEventListener("load", () => {
                setTimeout(() => revealApplication(true), 12000)
            })
        })()
    </script>
</head>

<body>
    <div id="startup-transition" role="status" aria-live="polite">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 720" aria-hidden="true">
            <rect width="720" height="720" rx="144" fill="#111827"/>
            <path d="M120 548V172h84l156 201 156-201h84v376h-90V309L360 503 210 309v239h-90Z" fill="#fff"/>
            <path d="M360 128 517 548h-82l-75-212-75 212h-82l157-420Z" fill="#a78bfa" opacity=".92"/>
        </svg>
        <p>Starting Mei</p>
    </div>

    <main id="app"></main>

    <script type="module" src="/index.js"></script>
</body>

</html>
